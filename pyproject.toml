[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pspa-dt"
version = "0.1.0"
description = "PSPA-DT: end-to-end 3-D photon-flux generation with nnU-Net v2"
requires-python = ">=3.10"
dependencies = [
  "nnunetv2==2.6.2",
  "torch>=2.1.2,<2.9",
  "mamba-ssm>=2.2.2",
  "einops>=0.7",
  "scipy>=1.10",
  "SimpleITK>=2.2.1",
]

[project.scripts]
pspa-dt-preprocess = "pspa_dt.cli:preprocess_main"
pspa-dt-train = "pspa_dt.cli:train_main"
pspa-dt-predict-flux = "pspa_dt.inference.predict_flux:predict_flux_entry_point"

[tool.setuptools.packages.find]
where = ["src"]
